<!-- ═══════════════════════════════════════════════════════════════════════
     §  STYLESHEET
     ─────────────────────────────────────────────────────────────────────
     The styles that lay out this page live inline: they are small, and an
     external stylesheet would be one more render-blocking request.  Bulky
     binary assets (fonts, images, textures) are never inlined -- they are
     referenced by URL and served from the CDN.  No build-time CSS modules,
     no preprocessor.  The only "framework" used here is the browser itself.

     Order matters: tokens (themes) are declared before the rules that
     consume them, and resets come before component styles so cascade
     specificity works in our favor without !important.
     ═══════════════════════════════════════════════════════════════════ -->
<style>

/* ──────────────────────────────────────────────────────────────────────
   §  1   FONTS
   ──────────────────────────────────────────────────────────────────────
   Two faces are used:

     1.  'Attic'   — a custom display face used only for the wordmark.
     2.  'Outfit'  — Google's variable sans-serif, weights 100–900,
                     used everywhere else.

   Both are plain woff2 files served from the CDN (jsDelivr, out of the
   MindAttic.UiUx repo under fonts/, pinned to a release tag)
   and are preloaded from <head>, so they start downloading before the CSS
   is parsed.  The @font-face rules sit in the <style> block right after
   this comment.  Outfit is split by unicode-range, so the browser only
   downloads the Latin-Extended file if a page actually uses one of its
   glyphs.  Attic uses font-display: block (a very short invisible period)
   so the wordmark never flashes in a fallback face; Outfit uses swap.

   ──────────────────────────────────────────────────────────────────── */

</style>

<style id="mindattic-fonts-css">
/* Outfit — Google Fonts, variable weight axis 100-900, split by unicode-range.
   Use the quoted stack ('Outfit', system-ui, sans-serif) or var(--font-outfit);
   a bare `font-family: Outfit;` can fail silently. */
@font-face {
  font-family: 'Outfit';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/mindattic/MindAttic.UiUx@V10/fonts/outfit/outfit-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Outfit';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/mindattic/MindAttic.UiUx@V10/fonts/outfit/outfit-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* Attic — the custom display face (wordmark only). */
@font-face {
  font-family: 'Attic';
  font-style: normal;
  font-weight: normal;
  font-display: block;
  src: url('https://cdn.jsdelivr.net/gh/mindattic/MindAttic.UiUx@V10/fonts/attic/attic.woff2') format('woff2');
}

/* Ergonomic reuse: var(--font-outfit) / var(--font-attic) instead of
   repeating the full stacks. */
:root { --font-outfit: 'Outfit', system-ui, sans-serif; --font-attic: 'Attic', serif; }

html, body { font-family: 'Outfit', system-ui, sans-serif; }
.site-name { font-family: 'Attic', serif; }
</style>

<style>

/* ──────────────────────────────────────────────────────────────────────
   §  2   THEME TOKENS
   ──────────────────────────────────────────────────────────────────────
   Every color the site uses lives here as a CSS custom property.

   The pattern:
     :root                    → the one and only palette (console-bg dark).

   The legacy light/dark toggle, the [data-theme="dark"] override, and the
   prefers-color-scheme media query have all been removed. Tokens stay on
   :root so a future palette can drop in here without touching every
   selector.

   Naming convention: --bg/--bg2/--bg3 walk from the page background
   inward (deeper surfaces get higher numbers).  --text/--text2/--text3
   walk from primary copy out toward muted captions the same way.

   --logo / --logo-tiny are the logo PNGs, served from the CDN (see § 8).
   ──────────────────────────────────────────────────────────────────── */

:root {
  --bg: #0d1117;
  --bg2: #13161b;
  --bg3: #1a1e25;
  --border: #2a2f3a;
  --accent: #6ba3e8;
  --accent2: #90bbf0;
  --text: #e8eaf0;
  --text2: #9aa0b0;
  --text3: #5c6275;
  --rule: #3d6fa3;
  --logo: url("https://cdn.jsdelivr.net/gh/mindattic/MindAttic.UiUx@V10/mindattic.com/logos/m-monogram.png");
  --logo-tiny: url("https://cdn.jsdelivr.net/gh/mindattic/MindAttic.UiUx@V10/mindattic.com/logos/m-icon-16.png");
}

/* ──────────────────────────────────────────────────────────────────────
   §  3   BACKGROUND
   ──────────────────────────────────────────────────────────────────────
   No rules here: the backdrop is the parallax circuit board painted by
   the CYBERSPACE bundle further down in this file (§ 12).  Edit the
   bundle in MindAttic.UiUx (not this file) to change it.
   ──────────────────────────────────────────────────────────────────── */

/* ──────────────────────────────────────────────────────────────────────
   §  4   ACCESSIBILITY
   ──────────────────────────────────────────────────────────────────────
   :focus-visible restores a clearly visible focus outline.  Browsers
   vary; this guarantees one consistent ring in the accent color.  We
   override the UA default rather than disable it — disabling focus
   styles is one of the fastest ways to make a site unusable.
   ──────────────────────────────────────────────────────────────────── */

:focus-visible {
  outline: 0.125rem solid var(--accent);
  outline-offset: 0.125rem;
}

/* ──────────────────────────────────────────────────────────────────────
   §  5   RESET
   ──────────────────────────────────────────────────────────────────────
   Not Eric Meyer's reset, not normalize.css.  Just three lines that
   the rest of the file actually depends on:

     box-sizing: border-box   — so widths include padding and border.
                                 The single most useful reset rule.
     margin / padding: 0      — so spacing comes from the components,
                                 not from accidental user-agent defaults.

   Below the universal reset, html/body get just enough setup to look
   intentional: anti-aliased text, the primary typeface, and a fixed
   viewport-height box with overflow hidden — the whole page is one
   screen that scales to fit, so there is never a scrollbar.

   Nothing on the page is selectable: it is a logo and three buttons, and
   every tap spawns a Cyberspace effect, so a drag or long-press should
   never paint a highlight.  user-select stops text selection,
   -webkit-touch-callout stops the iOS long-press copy/lookup bubble, and a
   transparent tap-highlight stops the grey flash on each tap.  Links still
   click, and keyboard focus rings (§ 4) are unaffected.
   ──────────────────────────────────────────────────────────────────── */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

html, body {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

a {
  color: var(--accent);
  text-decoration: none;
}

a:hover {
  color: var(--accent2);
}

/* ──────────────────────────────────────────────────────────────────────
   §  6   WORDMARK
   ──────────────────────────────────────────────────────────────────────
   The "MindAttic" logotype, centered above the link buttons.

   The wordmark uses 'Attic' (the custom face from § 1) — that's the
   only place the custom font appears.  Forcing pure white via
   #site-name instead of --text is deliberate: the wordmark is a brand
   element, not body copy, and it should always sit at maximum contrast.

   Its size is --wm = 11 × --u (both set on .lockup in § 7), so it is a
   fixed fraction of the screen.  white-space: nowrap makes the
   wordmark's own width the width of the whole lockup, which the buttons
   then match (§ 9).
   ──────────────────────────────────────────────────────────────────── */

#site-name {
  font-family: 'Attic', serif;
  font-size: var(--wm);
  color: #fff;
  letter-spacing: 0.01em;
  line-height: 1;
  margin: 0 auto calc(var(--u) * 1.5);
  font-weight: normal;
  text-align: center;
  display: block;
  width: 100%;
  white-space: nowrap;
}

/* ──────────────────────────────────────────────────────────────────────
   §  7   CONTENT
   ──────────────────────────────────────────────────────────────────────
   A single full-height column that centers the lockup (wordmark + link
   buttons) both ways on every screen.

   .lockup shrink-wraps to the wordmark (width: max-content), and the
   button row inside is told to fill 100% of it — so the three buttons
   together are exactly as wide as the "MindAttic" logo.

   One unit drives everything:  --u = 1% of the smaller visible viewport
   side (dvmin).  Every size on the page — wordmark, buttons, padding,
   gaps — is a fixed multiple of --u, so the layout is the same shape at
   every size and aspect ratio.  The wordmark is 5.3 × its font-size
   wide, i.e. ~58 × --u, which is always less than the smaller viewport
   side, so it can never overflow in portrait or landscape.  --u stops
   growing at 0.7273rem (wordmark capped at 8rem) so very large screens
   don't get absurdly big type.

   #content is a <div role="main">, not a <main>: Cyberspace treats every
   <main> as a keepout zone that effects stay out of, and a full-screen
   <main> would block the whole screen.  Only the .lockup carries
   .cyberspace-keepout, so effects fill everything around it.
   ──────────────────────────────────────────────────────────────────── */

#content {
  padding: 0;
  /* Sits above every Cyberspace backdrop layer (cyberspace-sl-fine/coarse
     and console-bg-host, all z-index 0). position:relative is required for
     z-index to take effect on a non-positioned element. */
  position: relative;
  z-index: 1000;
  max-width: 100%;
  margin-left: auto;
  margin-right: auto;
  box-sizing: border-box;
  /* Center the lockup both ways on every screen.  dvh follows the visible
     area on phones as the browser toolbar shows and hides. */
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.lockup {
  --u: min(1dvmin, 0.7273rem);
  --wm: calc(var(--u) * 11);
  width: max-content;
}

/* ──────────────────────────────────────────────────────────────────────
   §  8   LOGO ASSETS
   ──────────────────────────────────────────────────────────────────────
   Two helper classes for the CDN-hosted logo PNG (defined back in § 2):

     .logo       —  20rem hero variant.
     .logo-tiny  —   1rem favicon-sized variant.

   Both pull from the same artwork, so changing it in one place updates
   every appearance.  Neither is currently referenced in the body; they're
   kept here as ready-to-use hooks (favicons, inline list bullets, future
   use).
   ──────────────────────────────────────────────────────────────────── */

.logo,
.logo-tiny {
  display: block;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

.logo {
  background-image: var(--logo);
  width: 20rem;
  height: 20rem;
}

.logo-tiny {
  background-image: var(--logo-tiny);
  width: 1rem;
  height: 1rem;
}

/* ──────────────────────────────────────────────────────────────────────
   §  9   LINK BUTTONS
   ──────────────────────────────────────────────────────────────────────
   The three buttons (Résumé / GitHub / MindAttic Cares).  They open in
   new windows.

   Layout: one row of equal-width columns that fills 100% of the lockup,
   i.e. exactly the width of the wordmark.  Each 1fr track is the same
   width, and the widest label ("MindAttic Cares") sets the minimum, so no
   label can clip.  The row never wraps — it scales instead, so all three
   buttons are always visible.

   Sizing: every length inside is a multiple of --btn-u, which is a fixed
   fraction of the wordmark's size (--wm).  At 0.15 the three buttons'
   natural width is ~4.1 × the wordmark's font-size, comfortably under the
   wordmark's ~5.3 ×, so the label text stays small next to the logo and
   the spare space is shared evenly by the three equal columns.  (Anything
   up to ~0.19 still fits without clipping.)  Padding, gaps, radius,
   border, glow and lift all grow and shrink with the screen.

   Hover/focus: solid red fill, brighter border, soft glow and a small
   lift, eased in and out.  Text stays white in every link state (the
   global `a:hover` rule would otherwise recolor it).
   ──────────────────────────────────────────────────────────────────── */

.link-row {
  --btn-u: calc(var(--wm) * 0.15);
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  width: 100%;
  align-items: stretch;
  justify-content: center;
  font-size: var(--btn-u);
  gap: calc(var(--btn-u) * 0.6);
}

.link-btn {
  padding: calc(var(--btn-u) * 0.3) calc(var(--btn-u) * 0.6);
  border: max(0.0625rem, calc(var(--btn-u) * 0.12)) solid #e5484d;
  border-radius: calc(var(--btn-u) * 0.5);
  background: var(--bg2);
  color: #fff;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: var(--btn-u);
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  cursor: pointer;
  /* Smooth in/out interpolation between rest and hover states. */
  transition: background-color 0.28s cubic-bezier(0.4, 0, 0.2, 1),
              border-color 0.28s cubic-bezier(0.4, 0, 0.2, 1),
              box-shadow 0.28s cubic-bezier(0.4, 0, 0.2, 1),
              transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.link-btn:link,
.link-btn:visited,
.link-btn:hover,
.link-btn:focus,
.link-btn:active { color: #fff; }

.link-btn:hover,
.link-btn:focus-visible {
  background: #e5484d;
  border-color: #ff6b70;
  box-shadow: 0 0 calc(var(--btn-u) * 0.9) rgba(229, 72, 77, 0.55);
  transform: translateY(calc(var(--btn-u) * -0.12));
}

/* ──────────────────────────────────────────────────────────────────────
   §  10  FOOTER
   ──────────────────────────────────────────────────────────────────────
   A single-line copyright, dim-on-purpose so it never competes with the
   lockup for attention.  Fixed to the bottom edge of the screen (the page
   never scrolls, so it is always in view) and centered.  pointer-events:
   none keeps it from ever intercepting a click.
   ──────────────────────────────────────────────────────────────────── */

#site-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1000;
  text-align: center;
  padding: 0.75rem 1rem;
  font-size: 0.8125rem;
  color: var(--text2);   /* --text3 is only ~3:1 on --bg; --text2 stays dim but readable (WCAG AA) */
  pointer-events: none;
}

</style>

</head>

<style id="mindattic-components-cyberspace-css">

    bottom: 0;
    right: 0;
    width: clamp(260px, 30vw, 480px);
    height: auto;
    max-height: 80vh;
    object-fit: cover;
    object-position: top center;
    pointer-events: none;
    z-index: 0;
}

/* ── Console background windows (home / tile-board only) ───────────────── */
.console-bg-host {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.cyberspace-win {
    position: absolute;
    width: clamp(148px, 15vw, 228px);
    background: rgba(10, 12, 9, 0.92);
    border: 1px solid rgba(42, 52, 42, 0.52);
    border-radius: 4px;
    backdrop-filter: blur(3px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.42);
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.57rem;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transform: scaleY(0.06) scaleX(0.88);
    transform-origin: top left;
    animation: cyberspace-in 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.cyberspace-win--out { animation: cyberspace-out 0.14s cubic-bezier(0.5, 0, 1, 0.6) forwards !important; }
/* ── Console color variants ─── */
.cyberspace-win--blue { background: rgba(8, 12, 22, 0.92); border-color: rgba(40, 80, 180, 0.52); }
.cyberspace-win--blue .cyberspace-title { background: rgba(10, 16, 30, 0.94); color: rgba(100, 140, 220, 0.62); border-bottom-color: rgba(40, 80, 180, 0.42); }
.cyberspace-win--amber { background: rgba(18, 12, 4, 0.92); border-color: rgba(160, 100, 20, 0.52); }
.cyberspace-win--amber .cyberspace-title { background: rgba(22, 15, 5, 0.94); color: rgba(200, 150, 60, 0.62); border-bottom-color: rgba(160, 100, 20, 0.42); }
.cyberspace-cascade { animation: cyberspace-cascade-in 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes cyberspace-cascade-in {
    from { opacity: 0.08; transform: scale(0.97); }
    to   { opacity: 0.44; transform: scale(1); }
}
@keyframes cyberspace-in {
    to { opacity: 0.76; transform: scale(1); }
}
@keyframes cyberspace-out {
    0%   { opacity: 0.44; transform: scale(1); }
    40%  { opacity: 0.2;  transform: scaleX(0.86) scaleY(0.12) translateY(-4px); }
    100% { opacity: 0;    transform: scaleX(0.6)  scaleY(0)    translateY(-9px); }
}
.cyberspace-title {
    background: rgba(16, 18, 13, 0.94);
    color: rgba(130, 148, 120, 0.62);
    padding: 2px 7px;
    font-size: 0.51rem;
    letter-spacing: 0.04em;
    border-bottom: 1px solid rgba(42, 52, 42, 0.42);
    filter: blur(0.4px);
}
.cyberspace-body {
    padding: 4px 7px 5px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 112px;
    overflow: hidden;
}
.cyberspace-line {
    color: rgba(255, 255, 255, 0.38);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    filter: blur(1.2px);
    opacity: 0;
    animation: cyberspace-line-in 0.1s ease forwards;
}
@keyframes cyberspace-line-in {
    from { opacity: 0; transform: translateX(-3px); }
    to   { opacity: 1; transform: translateX(0); }
}
.cyberspace-ok  { color: rgba(63,  185, 80,  0.6); filter: blur(1.2px); }
.cyberspace-err { color: rgba(248,  81, 73,  0.6); filter: blur(1.2px); }

/* Fatal error popup — scary red box, icon left, text right, no button */
.cyberspace-err-popup {
    position: absolute;
    width: clamp(210px, 22vw, 310px);
    background: rgba(40, 8, 8, 0.94);
    border: 1px solid rgba(220, 53, 69, 0.75);
    outline: 1px solid rgba(255, 80, 80, 0.18);
    backdrop-filter: blur(3px);
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(220, 53, 69, 0.3),
                0 6px 28px rgba(180, 20, 20, 0.5);
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.57rem;
    overflow: hidden;
    pointer-events: none;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    opacity: 0;
    transform: scale(0.92);
    animation: cyberspace-err-in 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes cyberspace-err-in {
    to { opacity: 0.86; transform: scale(1); }
}
.cyberspace-err-popup-icon { display: none; }
.cyberspace-err-popup-content {
    flex: 1;
    padding: 7px 9px 7px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
}
.cyberspace-err-popup-title {
    color: rgba(255, 90, 90, 1);
    font-size: 0.59rem;
    font-weight: bold;
    letter-spacing: 0.04em;
    filter: blur(0.5px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.cyberspace-err-popup-msg {
    color: rgba(255, 140, 140, 0.88);
    filter: blur(1px);
    white-space: pre-line;
    line-height: 1.45;
}

/* ── Scan lines — static, 90-95% transparent ────────────────────────────── */
.cyberspace-sl-fine,
.cyberspace-sl-coarse {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.cyberspace-sl-fine {
    /* #ff0033 = rgb(255, 0, 51) */
    background: repeating-linear-gradient(
        to bottom,
        rgba(255, 0, 51, 0.09) 0px,
        rgba(255, 0, 51, 0.09) 1px,
        transparent            1px,
        transparent            3px
    );
    opacity: 0.08;
}
.cyberspace-sl-coarse {
    /* #ff0033 + 15% green variance → rgb(255, 38, 51) */
    background: repeating-linear-gradient(
        to bottom,
        rgba(255, 38, 51, 0.06) 0px,
        rgba(255, 38, 51, 0.06) 1px,
        transparent             1px,
        transparent             7px
    );
    opacity: 0.06;
}

/* ── Warning popup — amber box, less severe than error ──────────────────── */
.cyberspace-warn-popup {
    position: absolute;
    width: clamp(190px, 20vw, 290px);
    background: rgba(18, 14, 0, 0.94);
    border: 1px solid rgba(200, 150, 20, 0.75);
    outline: 1px solid rgba(255, 190, 0, 0.14);
    backdrop-filter: blur(3px);
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(200, 150, 20, 0.25),
                0 6px 28px rgba(120, 80, 0, 0.35);
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.57rem;
    overflow: hidden;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: scale(0.92);
    animation: cyberspace-warn-in 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes cyberspace-warn-in {
    to { opacity: 0.82; transform: scale(1); }
}
.cyberspace-warn-popup-content {
    flex: 1;
    padding: 7px 9px 7px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
}
.cyberspace-warn-popup-title {
    color: rgba(255, 200, 50, 1);
    font-size: 0.59rem;
    font-weight: bold;
    letter-spacing: 0.04em;
    filter: blur(0.5px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.cyberspace-warn-popup-msg {
    color: rgba(255, 200, 100, 0.85);
    filter: blur(1px);
    white-space: pre-line;
    line-height: 1.45;
}

/* ── Floating code fragments ────────────────────────────────────────────── */
.cyberspace-frag {
    position: absolute;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.42rem;
    color: rgba(110, 210, 130, 0.75);
    white-space: pre;
    line-height: 1.38;
    pointer-events: none;
    filter: blur(2.4px);
    opacity: 0;
    animation: cyberspace-frag-in 0.06s ease forwards;
}
@keyframes cyberspace-frag-in {
    to { opacity: 1; }
}
/* Fragment color variants — additive over the base .cyberspace-frag green. */
.cyberspace-frag--cyan    { color: rgba(110, 220, 230, 0.75); }
.cyberspace-frag--amber   { color: rgba(220, 180,  90, 0.75); }
.cyberspace-frag--magenta { color: rgba(220, 110, 200, 0.75); }
.cyberspace-frag--white   { color: rgba(220, 225, 230, 0.65); }

.cyberspace-frag--out {
    animation: cyberspace-frag-blink 0.34s steps(1) forwards !important;
}
@keyframes cyberspace-frag-blink {
    0%   { opacity: 1; }
    16%  { opacity: 0; }
    33%  { opacity: 0.8; }
    50%  { opacity: 0; }
    66%  { opacity: 0.4; }
    83%  { opacity: 0; }
    100% { opacity: 0; }
}

/* ── Geometry schematic windows ───────────────────────────────────────── */
.cyberspace-geo-win {
    width: fit-content;
    padding: 6px;
    border-color: rgba(48, 90, 200, 0.42);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.42), 0 0 10px rgba(48, 120, 255, 0.07);
    animation: cyberspace-geo-in 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes cyberspace-geo-in {
    from { opacity: 0; transform: scaleY(0.06) scaleX(0.88); }
    to   { opacity: 0.32; transform: scale(1); }
}
.cyberspace-geo-body {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 6px;
}
.cyberspace-geo-canvas { display: block; background: transparent; flex-shrink: 0; }
.cyberspace-geo-report {
    width: 144px;
    height: 110px;
    overflow: hidden;
    position: relative;
    border-left: 1px solid rgba(70, 200, 160, 0.15);
    padding-left: 5px;
    flex-shrink: 0;
}
.cyberspace-geo-report-inner {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.33rem;
    color: rgba(70, 210, 160, 0.55);
    line-height: 1.45;
    white-space: pre;
    pointer-events: none;
    will-change: transform;
}
@media (max-width: 480px) {
    .cyberspace-geo-win { width: 120px; }
    .cyberspace-geo-report { display: none; }
}

/* ── Floating artifacts — blurry glyph clusters that drift and fade ─────── */
.cyberspace-artifact {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    width: 0;
    height: 0;
}
/* Predator wasps use #ff2244. ARTIFACT cells stay off that hue so the consume-and-
   convert flash is visually unambiguous. The --red palette is no longer rotated in
   from spawnArtifact (see ART_PALETTES in console-bg.js). */
.cyberspace-artifact--white { color: rgba(220, 225, 230, 0.37); }
.cyberspace-artifact--blue  { color: rgba(60,  130, 255, 0.37); }
.cyberspace-artifact--amber { color: rgba(255, 185, 60,  0.37); }
.cyberspace-artifact-char {
    position: absolute;
    font-family: 'Courier New', Courier, monospace;
    line-height: 1;
    pointer-events: none;
    animation: cyberspace-art-flicker 0.7s steps(1) infinite;
}
/* Quake-style stepped flicker — rapid strobing like a bad CRT contact */
@keyframes cyberspace-art-flicker {
    0%   { opacity: 1.00; }
    7%   { opacity: 0.00; }
    14%  { opacity: 0.85; }
    21%  { opacity: 0.00; }
    28%  { opacity: 1.00; }
    35%  { opacity: 0.20; }
    42%  { opacity: 0.90; }
    49%  { opacity: 0.00; }
    56%  { opacity: 0.75; }
    63%  { opacity: 0.00; }
    70%  { opacity: 1.00; }
    77%  { opacity: 0.10; }
    84%  { opacity: 0.95; }
    91%  { opacity: 0.00; }
    100% { opacity: 1.00; }
}
/* Each artifact body segment — its own grid container, offset behind the leader so segments
   overlap. The seg-wave animation sways the whole segment perpendicular to the travel axis,
   with each segment phase-shifted so the chain moves like a peristaltic wave. */
.cyberspace-artifact-seg {
    position: absolute;
    width: 0;
    height: 0;
    pointer-events: none;
}
@keyframes cyberspace-art-seg-wave {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(var(--swx, 0px), var(--swy, 0px)); }
}

/* Slug-crawl on the artifact container — translates the whole structure across the screen
   while it lives, fades in at the start, disintegrates (fade out + slight scale collapse) at the end. */
@keyframes cyberspace-artifact-crawl {
    0%   { transform: translate(0, 0) scale(0.92); opacity: 0; }
    8%   { transform: translate(calc(var(--cdx, 0px) * 0.03), calc(var(--cdy, 0px) * 0.03)) scale(1.0); opacity: 1; }
    78%  { transform: translate(calc(var(--cdx, 0px) * 0.78), calc(var(--cdy, 0px) * 0.78)) scale(1.0); opacity: 1; }
    92%  { transform: translate(calc(var(--cdx, 0px) * 0.94), calc(var(--cdy, 0px) * 0.94)) scale(1.06); opacity: 0.45; }
    100% { transform: translate(var(--cdx, 0px), var(--cdy, 0px)) scale(0.7); opacity: 0; }
}

/* Per-cell undulation — each cell slides through a small loop on its own random phase.
   Neighbors out of phase = the lattice deforms/breathes like an amoeba's body. */
@keyframes cyberspace-art-undulate {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25%      { transform: translate(var(--ux, 0px), var(--uy, 0px)) scale(1.03); }
    50%      { transform: translate(0, calc(var(--uy, 0px) * 0.5)) scale(0.97); }
    75%      { transform: translate(calc(var(--ux, 0px) * -0.7), 0) scale(1.02); }
}

/* Heartbeat — radial outward push twice in quick succession (lub-dub), then a long rest.
   Each cell's --px/--py is its own outward direction, magnitude scaled per ring. */
@keyframes cyberspace-art-heartbeat {
    0%   { transform: translate(0, 0); }
    /* lub */
    8%   { transform: translate(var(--px, 0px), var(--py, 0px)); }
    18%  { transform: translate(0, 0); }
    /* dub — slightly weaker */
    26%  { transform: translate(calc(var(--px, 0px) * 0.7), calc(var(--py, 0px) * 0.7)); }
    36%  { transform: translate(0, 0); }
    /* rest — diastole */
    100% { transform: translate(0, 0); }
}

/* Purposeful one-way drift — each char travels toward --adx1/--ady1 (a shared
   cluster direction with per-glyph spread). The further it gets, the more it
   blurs and fades. Plays once with forwards fill so it vanishes at its destination. */
@keyframes cyberspace-art-drift {
    0%   { transform: translate(0, 0);
           filter: blur(var(--abl)) opacity(0.88); }
    40%  { transform: translate(calc(var(--adx1) * 0.4), calc(var(--ady1) * 0.4));
           filter: blur(calc(var(--abl) * 1.3)) opacity(0.80); }
    75%  { transform: translate(calc(var(--adx1) * 0.75), calc(var(--ady1) * 0.75));
           filter: blur(calc(var(--abl) * 2.6)) opacity(0.38); }
    92%  { transform: translate(var(--adx1), var(--ady1));
           filter: blur(calc(var(--abl) * 4.0)) opacity(0.08); }
    100% { transform: translate(var(--adx1), var(--ady1));
           filter: blur(calc(var(--abl) * 4.5)) opacity(0); }
}

/* ── Entity tab neon flicker — broken-neon-sign effect on entity load ─────────
   Cyberpunk urban-decay vibe. Irregular opacity drops, brief saturation shifts,
   then a clean settle. Lives ~1.6s, applied to ~25% of tabs by JS at entity load. */
.entity-tab-flicker {
    animation: cyberspace-tab-neon-flicker 1.6s linear forwards;
}
/* ── List-item neon flicker — same animation, but LOOPED so it keeps misbehaving
   until the user clicks the item. Clicking removes the class and the item
   "fixes itself" on selection. Applied to ~25% of dictionary list items by JS.
   DISABLED 2026-05-09: nothing applies the class right now. CSS kept here so
   re-enabling is just uncommenting the JS call in MainLayout. */
.neon-flicker-loop {
    animation: cyberspace-tab-neon-flicker 2.4s linear infinite;
}
@keyframes cyberspace-tab-neon-flicker {
    0%   { opacity: 1; filter: none; text-shadow: 0 0 6px currentColor; }
    3%   { opacity: 0.10; filter: brightness(0.5) saturate(0.6); }
    6%   { opacity: 1;    filter: brightness(1.3) saturate(1.4); text-shadow: 0 0 9px currentColor, 0 0 16px currentColor; }
    9%   { opacity: 0.05; filter: brightness(0.4); }
    13%  { opacity: 1;    filter: brightness(1.2); }
    17%  { opacity: 0.35; }
    21%  { opacity: 1; }
    28%  { opacity: 0.06; filter: brightness(0.3) saturate(0.4); }
    33%  { opacity: 1;    filter: brightness(1.4) saturate(1.5); text-shadow: 0 0 12px currentColor; }
    40%  { opacity: 0.50; }
    47%  { opacity: 1; }
    56%  { opacity: 0.12; filter: brightness(0.5); }
    62%  { opacity: 1; }
    74%  { opacity: 0.7;  filter: brightness(1.1); }
    85%  { opacity: 1;    filter: none; text-shadow: 0 0 4px currentColor; }
    100% { opacity: 1;    filter: none; text-shadow: none; }
}

/* ── HEIST — semi-transparent file browser, solid color (no scan lines) ─────── */
.cyberspace-folder-win {
    position: absolute;
    width: 220px;
    background: rgba(8, 9, 14, 0.32);   /* more transparent — what's underneath shows through clearly */
    border: 1px solid rgba(120, 130, 150, 0.32);
    color: rgba(200, 210, 220, 0.88);
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.55rem;
    padding: 8px 10px 10px;
    pointer-events: none;
    z-index: 4;
    overflow: visible;                  /* let ripped folders slide outside the window */
    /* Override cyberspace-in's 0.76 endpoint — heist window sits 15% more transparent overall (0.61). */
    animation: cyberspace-folder-win-in 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes cyberspace-folder-win-in {
    to { opacity: 0.61; transform: scale(1); }
}
.cyberspace-folder-win .cyberspace-title {
    position: relative;
    z-index: 1;
    font-size: 0.55rem;
    color: rgba(180, 195, 210, 0.85);
    border-bottom: 1px solid rgba(120, 130, 150, 0.30);
    padding-bottom: 3px;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.cyberspace-folder-list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: visible;                  /* folders escape the list bounds during the rip */
}
/* Folder rectangle with the upper-RIGHT corner cut at 45° (manila-folder tab silhouette).
   Background is OPAQUE so the semi-transparent heist window's see-through backdrop cannot
   bleed through the rows — only the empty parts of the window stay see-through. */
.cyberspace-folder {
    position: relative;
    background: rgb(20, 26, 36);
    border: 1px solid rgba(140, 160, 180, 0.18);
    color: rgba(210, 220, 235, 0.75);
    font-size: 0.6rem;
    padding: 3px 14px 3px 8px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    transition: background 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
    will-change: transform, opacity;
}
.cyberspace-folder.cyberspace-folder-highlight {
    background: rgb(28, 58, 78);
    border-color: rgba(140, 220, 255, 0.75);
    color: rgba(230, 245, 255, 0.9);
    box-shadow: 0 0 9px rgba(80, 200, 255, 0.45);
}
/* The ripping folder must lift above its siblings AND the window so it visibly slides
   past the right edge instead of getting clipped underneath. */
.cyberspace-folder.cyberspace-folder-ripping {
    z-index: 5;
}
/* Sleek single-motion extraction. The transform interpolates ONLY between 0% and 100%, so
   the slide is one continuous easing curve with no velocity changes. Opacity shimmer lives on
   intermediate keyframes that omit transform — they don't perturb the motion. */
@keyframes cyberspace-folder-rip {
    0%   { transform: translate(0, 0); opacity: 1; filter: blur(0); }
    24%  { opacity: 0.55; }
    40%  { opacity: 0.95; }
    100% { transform: translate(var(--rx, 240px), 0); opacity: 0; filter: blur(1.2px); }
}
/* Window dissolve after the steal completes. Driven by a keyframe rather than
   an inline opacity transition because the window still has cyberspace-in's
   animation-fill-mode:forwards asserting opacity 0.76 — a transition can lose
   the race against that fill-state. A fresh animation overrides the prior
   forwards fill cleanly so the fade resolves every time. */
@keyframes cyberspace-folder-win-fade {
    0%   { opacity: 0.61; }
    100% { opacity: 0;    }
}
.cyberspace-folder-win--fade {
    animation: cyberspace-folder-win-fade 0.55s ease forwards !important;
}

/* ── Morse-code glowing dot — pulses or shifts at cheat-code speed, with blur ─ */
/* Outer "orbit" container — drifts very slowly across the sky like a satellite.
   The dot inside is positioned at 0,0 so its shift-mode transform composes with the drift. */
.cyberspace-morse-orbit {
    position: absolute;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 3;
    will-change: transform;
}
@keyframes cyberspace-morse-orbit-drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(var(--ox, 0), var(--oy, 0)); }
}
.cyberspace-morse-dot {
    position: absolute;
    left: 0;
    top: 0;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    background: rgba(var(--mc, 255, 255, 255), 0.18);
    box-shadow: 0 0 2px rgba(var(--mc, 255, 255, 255), 0.25);
    transform: translate(0, 0);
    /* Soft halo blur — the dot is fuzzy at the edges so fast shifts smear like motion blur */
    filter: blur(0.5px);
    will-change: transform, background, box-shadow, filter;
}
.cyberspace-morse-dot.cyberspace-morse-on {
    background: rgba(var(--mc, 255, 255, 255), 1);
    box-shadow:
        0 0 5px  rgba(var(--mc, 255, 255, 255), 1),
        0 0 12px rgba(var(--mc, 255, 255, 255), 0.85),
        0 0 24px rgba(var(--mc, 255, 255, 255), 0.50);
    /* Stronger blur when lit so fast keystrokes look like a glowing trail */
    filter: blur(0.9px);
}

/* ── Network connection attempts ───────────────────────────────────────── */
.cyberspace-net-node {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    font-family: 'Courier New', monospace;
    font-size: 0.55rem;
    padding: 2px 5px;
    border: 1px solid;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    animation: cyberspace-net-in 0.18s ease forwards;
}
@keyframes cyberspace-net-in {

            return true;
        }

        // Seed lines scattered across the image so it isn't empty on load
        var lines = [];
        var seedCount = 5 + Math.floor(Math.random() * 6);  // 5–10
        for (var i = 0; i < seedCount; i++) {
            var goDown = Math.random() < 0.5;
            var ln = makeLine(goDown);
            ln.y = (ol.height / seedCount) * i + Math.random() * (ol.height / seedCount);
            lines.push(ln);
        }

        // Rolling spawner
        var lastSpawnTime  = 0;
        var nextSpawnDelay = 300 + Math.random() * 900;

        function trySpawn(now) {
            // ~1% chance: one oddly slow line
            if (Math.random() < 0.01) {
                var dir = Math.random() < 0.5;
                if (canSpawn(dir)) {
                    var slow = makeLine(dir, 0.5 + Math.random() * 0.7);
                    slow.noiseFreq   = 0.0001 + Math.random() * 0.0003;  // very slow undulation
                    slow.flickerRate = 0.03;  // barely flickers — eerily steady
                    lines.push(slow);
                }
                return;
            }

            // Occasionally a cluster (same direction, shared base speed)
            var isCluster   = Math.random() < 0.30;
            var goDown      = Math.random() < 0.5;
            var sharedSpeed = isCluster ? (2.5 + Math.random() * 5.5) : undefined;
            var count       = isCluster ? 2 + Math.floor(Math.random() * 4) : 1;
            for (var k = 0; k < count; k++) {
                if (!canSpawn(isCluster ? goDown : Math.random() < 0.5)) continue;
                var dir = isCluster ? goDown : Math.random() < 0.5;
                lines.push(makeLine(dir, isCluster ? sharedSpeed : undefined));
            }
        }

        function frame(now) {
            syncRect();
            ctx2.clearRect(0, 0, ol.width, ol.height);

            // Spawn
            if (now - lastSpawnTime > nextSpawnDelay) {
                trySpawn(now);
                lastSpawnTime  = now;
                nextSpawnDelay = 300 + Math.random() * 900;
            }

            // Advance + draw + cull
            for (var j = lines.length - 1; j >= 0; j--) {
                var ln = lines[j];
                ln.y += ln.speed;

                if (ln.y > ol.height + ln.h || ln.y < -ln.h - 2) {
                    lines.splice(j, 1);  // one pass — despawn, no replacement
                    continue;
                }

                // Noise-driven base opacity: smoothly undulates each line independently
                var noiseVal = vnoise(now * ln.noiseFreq + ln.noiseSeed, ln.noiseSeed * 2.71828);
                var noiseOp  = 0.10 + noiseVal * 0.55;  // 0.10–0.65

                // Violent flicker spike on top of noise
                var flicker = Math.random() < ln.flickerRate
                    ? (Math.random() < 0.5 ? -noiseOp * 1.8 : noiseOp * 1.2)
                    : 0;
                var op = Math.max(0, Math.min(0.95, noiseOp + flicker));
                ctx2.fillStyle = 'rgba(13,17,23,' + op + ')';
                ctx2.fillRect(0, Math.round(ln.y), ol.width, ln.h);
            }

            scanlinesRaf = requestAnimationFrame(frame);
        }

        // Capture the initial frame's id too, so a stopScanlineAnim() that lands
        // before the first frame fires can cancel it — otherwise that orphaned
        // callback re-arms itself and runs forever on a detached canvas.
        scanlinesRaf = requestAnimationFrame(frame);
    }

    // ── Public entry point ───────────────────────────────────────────────────

    function apply(imgId, imageUrl) {
        var imgEl = document.getElementById(imgId);
        if (!imgEl) return;

        stopScanlineAnim();
        stopLightFlicker();

        var src = new Image();
        src.onload = function () {
            var dataUrl = renderTorn(src);
            if (dataUrl) { imgEl.src = dataUrl; }
            imgEl.style.opacity = '1';
            startLightFlicker(imgEl);
            // Wait one frame so the img has its final layout rect. Track the id
            // so a stopScanlineAnim() landing before it fires can cancel it.
            scanStartRaf = requestAnimationFrame(function () {
                scanStartRaf = null;
                startScanlineAnim(imgEl);
            });
        };
        src.onerror = function () { imgEl.style.opacity = '1'; };
        src.src = imageUrl;
    }

    return { apply: apply };
})();

</script>

<!-- ═════════════════════════════════════════════
     §  11  BODY
     ─────────────────────────────────────────────
     Reading order from top to bottom, exactly as the DOM ships:

       #content           — one centered lockup: the wordmark, then the
                            three link buttons directly beneath it.
       <footer>           — Copyright, fixed to the bottom edge.
       <script>           — tap anywhere to spawn a random Cyberspace effect.

     The three links are plain <a> elements — no script builds them, so
     they render even if JavaScript is off.  Each opens in a new window
     (noopener noreferrer keeps the new page from touching this one), and
     aria-describedby points at a hidden "Opens in a new window." note so
     screen readers announce that without changing the visible label.

     #content is a <div role="main"> rather than a <main> on purpose: see
     the keepout note in § 7.  The explicit role keeps it a landmark for
     screen readers.
     ═════════════════════════════════════════════ -->

<div id="content" role="main">
  <div class="lockup cyberspace-keepout">
    <h1 id="site-name" class="site-name">MindAttic</h1>
    <nav class="link-row" aria-label="Links">
      <a class="link-btn" href="https://ryandebraal.com" target="_blank" rel="noopener noreferrer" aria-describedby="new-window-note">R&eacute;sum&eacute;</a>
      <a class="link-btn" href="https://github.com/mindattic" target="_blank" rel="noopener noreferrer" aria-describedby="new-window-note">GitHub</a>
      <a class="link-btn" href="https://mindatticcares.com" target="_blank" rel="noopener noreferrer" aria-describedby="new-window-note">MindAttic Cares</a>
    </nav>
    <span id="new-window-note" hidden>Opens in a new window.</span>
  </div>
</div>

<!-- The footer.  document.write() is used here for a one-shot,
     pre-DOMContentLoaded year stamp — no need for a global handler
     when the value is needed exactly once at parse time.  In any
     other context document.write would be a code smell; this is the
     one legitimate use that survived the modern era. -->
<footer id="site-footer" role="contentinfo">
  <span>&copy; <script>document.write(new Date().getFullYear())</script> MindAttic LLC</span>
</footer>

<!-- Tap / click anywhere → spawn one random Cyberspace effect.
     console-bg.js (loaded above in the CYBERSPACE block) exposes its spawn
     functions on window.consoleBg._demo.  Underscore-prefixed means "dev
     handle, not a stable API", but it's the only public way to fire a single
     effect on demand, and every function used here exists in the pinned
     release.  The effects that accept a position (CRASH, TREMOR,
     TERMINAL) appear where you tapped; the rest place themselves using
     Cyberspace's own placement rules (which avoid the .lockup keepout).
     Taps on a link are ignored so the buttons just open their sites.  If the
     CDN script failed to load, window.consoleBg is undefined and this does
     nothing. -->
<script>
// The engine scripts are `defer`red, so they run after parsing and before
// DOMContentLoaded; look the engine up then, not at parse time.
document.addEventListener('DOMContentLoaded', function () {
  var fx = window.consoleBg && window.consoleBg._demo;
  if (!fx) return;

  var effects = [
    function (x, y) { fx.spawnError(x, y); },        // CRASH  — fatal-error popup
    function (x, y) { fx.spawnWarning(x, y); },      // TREMOR — warning popup
    function (x, y) { fx.spawnWindow(0, x, y); },    // TERMINAL — console window
    function () { fx.spawnMemo(); },                 // LEAK
    function () { fx.spawnFrag(); },                 // FRAGMENT
    function () { fx.spawnArtifact(); },             // ARTIFACT (random variant)
    function () { fx.spawnGeoWindow(); },            // SCHEMATIC
    function () { fx.spawnNetConnect(); },           // TRACE
    function () { fx.spawnMorseDot(); },             // PULSAR
    function () { fx.spawnFolderRip(); },            // HEIST
    function () { fx.spawnCascade(); },              // CASCADE
    function () { fx.spawnArtifactPredator(); }      // PREDATOR
  ];

  document.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;   // right/middle click: leave the context menu alone
    if (e.target.closest && e.target.closest('a')) return;
    // Tap point as a viewport %, nudged so the popup lands around the tap
    // and clamped so it stays fully on screen.
    var x = Math.min(Math.max(e.clientX / window.innerWidth  * 100 - 8, 0), 78);
    var y = Math.min(Math.max(e.clientY / window.innerHeight * 100 - 5, 0), 85);
    try { effects[Math.floor(Math.random() * effects.length)](x, y); } catch (err) {}
  });
});
</script>

</body>
