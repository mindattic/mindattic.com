[data-theme="dark"] {
  --bg: #000;
  --bg2: #13161b;
  --bg3: #1a1e25;
  --border: #2a2f3a;
  --accent: #6ba3e8;
  --accent2: #90bbf0;
  --text: #e8eaf0;
  --text2: #9aa0b0;
  --text3: #5c6275;
  --rule: #3d6fa3;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000;
    --bg2: #13161b;
    --bg3: #1a1e25;
    --border: #2a2f3a;
    --accent: #6ba3e8;
    --accent2: #90bbf0;
    --text: #e8eaf0;
    --text2: #9aa0b0;
    --text3: #5c6275;
    --rule: #3d6fa3;
  }
}

/* ── BACKGROUND ── */

#bg-light,
#bg-dark {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-position: 0% 100%;
  background-repeat: no-repeat;
  background-size: contain;
  pointer-events: none;
  z-index: -1;
  transition: opacity 0.4s ease;
}

#bg-light {
  background-image: var(--bg-abstract-light);
}

#bg-dark {
  background-image: var(--bg-abstract-dark);
}

/* ── RESET ── */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: color 0.3s;
}

a {
  color: var(--accent);
  text-decoration: none;
}

a:hover {
  color: var(--accent2);
}

/* ── SITE HEADER ── */

#site-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 24px 32px;
}

#site-logo {
  width: 40px;
  height: 40px;
  background-image: var(--logo);
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  flex-shrink: 0;
}

#site-name {
  font-family: 'Attic', serif;
  font-size: 32px;
  color: #000;
  letter-spacing: 0.01em;
  line-height: 1;
}

[data-theme="dark"] #site-name {
  color: #fff;
}

/* ── CONTENT ── */

#content {
  padding: 24px 32px;
}

h1, h2 {
  color: #000;
}

[data-theme="dark"] h1,
[data-theme="dark"] h2 {
  color: #fff;
}

#content h2 {
  margin-top: 24px;
  margin-bottom: 8px;
  font-size: 18px;
}

#content h2:first-child {
  margin-top: 0;
}

#content a {
  display: block;
  color: #ff0033;
  margin-bottom: 4px;
}

#content a:hover {
  color: #cc0022;
}

/* ── LOGO ASSETS ── */

.logo,
.logo-tiny {
  display: block;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

.logo {
  background-image: var(--logo);
  width: 320px;
  height: 320px;
}

.logo-tiny {
  background-image: var(--logo-tiny);
  width: 16px;
  height: 16px;
}

/* ── FOOTER ── */

#site-footer {
  text-align: center;
  padding: 24px 32px;
  font-size: 13px;
  color: var(--text3);
}

#site-footer.pinned {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
}

/* ── THEME TOGGLE ── */

#theme-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 100;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 8px 10px;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}

#theme-toggle:hover {
  background: var(--bg3);
  border-color: var(--accent);
  color: var(--accent);
}

#theme-toggle.switching {
  pointer-events: none;
  cursor: wait;
}

</style>
</head>
<body>

<div id="bg-light"></div>
<div id="bg-dark"></div>

<button id="theme-toggle" title="Toggle theme" aria-label="Toggle light/dark theme">&#x2600;</button>

<header id="site-header">
  <span id="site-name">MindAttic</span>
</header>

<div id="content">
  <h2>Portfolio</h2>
  <a href="https://ryandebraal.com" target="_blank" rel="noopener">ryandebraal.com</a>
  <a href="https://github.com/mindattic" target="_blank" rel="noopener">github.com/mindattic</a>

  <h2>Projects</h2>
  <a href="https://mindattic.com/taxratecollector" target="_blank" rel="noopener">TaxRateCollector</a>
  <a href="https://mindatticcares.com" target="_blank" rel="noopener">MindAttic Cares</a>
  <a href="https://streetsamurai.azurewebsites.net/" target="_blank" rel="noopener">StreetSamurai</a>
</div>

<footer id="site-footer">
  <span>&copy; <script>document.write(new Date().getFullYear())</script> MindAttic LLC</span>
</footer>

<script>
(function () {
  var btn = document.getElementById('theme-toggle');
  var html = document.documentElement;

  var bgLight = document.getElementById('bg-light');
  var bgDark  = document.getElementById('bg-dark');

  function isDark() {
    return html.getAttribute('data-theme') === 'dark';
  }

  // Fade in on page load
  function initTheme(dark) {
    // Set theme colors instantly
    html.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.textContent = dark ? '☾' : '☀';
    // Start both at 0, then fade in the correct one
    bgLight.style.transition = 'none';
    bgDark.style.transition  = 'none';
    bgLight.style.opacity = '0';
    bgDark.style.opacity  = '0';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var activeEl = dark ? bgDark : bgLight;
        activeEl.style.transition = 'opacity 2s ease';
        activeEl.style.opacity = '1';
      });
    });
  }

  // Sequenced toggle: fade out → swap colors → fade in
  var switching = false;
  function apply(dark) {
    if (switching) return;
    switching = true;
    btn.classList.add('switching');

    var outEl = dark ? bgLight : bgDark;
    var inEl  = dark ? bgDark  : bgLight;

    // Step 1: fade out current bg (fast)
    outEl.style.transition = 'opacity 0.33s ease';
    outEl.style.opacity = '0';

    setTimeout(function () {
      // Step 2: swap theme colors instantly
      html.setAttribute('data-theme', dark ? 'dark' : 'light');
      btn.textContent = dark ? '☾' : '☀';
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}

      // Step 3: fade in new bg (slower)
      inEl.style.transition = 'opacity 2s ease';
      inEl.style.opacity = '1';

      setTimeout(function () { switching = false; btn.classList.remove('switching'); }, 2330);
    }, 400);
  }

  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  initTheme(saved === 'dark');

  btn.addEventListener('click', function () {
    apply(!isDark());
  });
}());

(function () {
  var footer = document.getElementById('site-footer');

  function pinFooter() {
    var hasScrollbar = document.documentElement.scrollHeight > window.innerHeight;
    footer.classList.toggle('pinned', !hasScrollbar);
  }

  pinFooter();
  window.addEventListener('resize', pinFooter);
}());
</script>
</body>
</html>
